name: Update Sunset Profile Telemetry

on:
  schedule:
    # Runs every 12 hours to refresh Public + Private + PR language stats
    - cron: '0 */12 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'scripts/update-stats.js'
      - '.github/workflows/update-profile-stats.yml'

permissions:
  contents: write

jobs:
  update-telemetry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate Unified Sunset Profile & Telemetry SVG
        env:
          GITHUB_USERNAME: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          INCLUDE_FORKS: 'true'
        run: node scripts/update-stats.js

      - name: Commit & Push updated SVG canvas
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile-master.svg assets/languages-sunset.svg
          if git diff --staged --quiet; then
            echo "No telemetry changes detected."
          else
            git commit -m "chore(telemetry): update unified sunset profile canvas [skip ci]"
            git push
          fi
