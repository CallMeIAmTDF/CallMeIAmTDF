<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%">
  <defs>
    <!-- Lo-fi Sunset / Dusk Sky Gradient -->
    <linearGradient id="skyDusk" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#110921"/>
      <stop offset="28%" stop-color="#221238"/>
      <stop offset="56%" stop-color="#451c4d"/>
      <stop offset="78%" stop-color="#87335a"/>
      <stop offset="93%" stop-color="#d46260"/>
      <stop offset="100%" stop-color="#ffaa6c"/>
    </linearGradient>

    <!-- Setting Sun Gradient -->
    <linearGradient id="sunsetOrb" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff3c4"/>
      <stop offset="35%" stop-color="#ffb86c"/>
      <stop offset="75%" stop-color="#f76b8a"/>
      <stop offset="100%" stop-color="#9e3768" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Atmospheric Horizon Mist -->
    <linearGradient id="horizonMist" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff9e64" stop-opacity="0"/>
      <stop offset="65%" stop-color="#ff857a" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#2a133d" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Glassmorphic Card Surface -->
    <linearGradient id="glassCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#190e2e" stop-opacity="0.78"/>
      <stop offset="100%" stop-color="#2b1640" stop-opacity="0.58"/>
    </linearGradient>

    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffbe98" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#f7768e" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#bb9af7" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Outrun / Lo-fi Retro Sun Scanlines Mask -->
    <mask id="sunScanlines">
      <rect x="700" y="60" width="320" height="300" fill="white"/>
      <rect x="700" y="218" width="320" height="3" fill="black"/>
      <rect x="700" y="230" width="320" height="4" fill="black"/>
      <rect x="700" y="244" width="320" height="5.5" fill="black"/>
      <rect x="700" y="260" width="320" height="7" fill="black"/>
      <rect x="700" y="278" width="320" height="9" fill="black"/>
      <rect x="700" y="298" width="320" height="12" fill="black"/>
    </mask>

    <clipPath id="bannerClip">
      <rect x="0" y="0" width="1200" height="380" rx="22"/>
    </clipPath>
  </defs>

  <style>
    .eyebrow {
      font: 600 11.5px 'Cascadia Code', 'Fira Code', 'JetBrains Mono', monospace;
      fill: #ffbe98;
      letter-spacing: 2.6px;
    }
    .hero-name {
      font: 800 44px 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, sans-serif;
      fill: #fff8f6;
      letter-spacing: 0.8px;
    }
    .hero-handle {
      font: 500 20px 'Cascadia Code', 'Fira Code', monospace;
      fill: #ff9e64;
    }
    .poetic-quote {
      font: italic 400 15.5px Georgia, 'Times New Roman', serif;
      fill: #f3d5e5;
      letter-spacing: 0.4px;
    }
    .role-pill-text {
      font: 600 11.5px 'Cascadia Code', 'Fira Code', monospace;
      fill: #ffe8d6;
      letter-spacing: 0.7px;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.2; transform: scale(0.85); }
      50% { opacity: 0.95; transform: scale(1.15); }
    }
    @keyframes cloudDriftSlow {
      0%, 100% { transform: translateX(0px); }
      50% { transform: translateX(28px); }
    }
    @keyframes cloudDriftReverse {
      0%, 100% { transform: translateX(0px); }
      50% { transform: translateX(-24px); }
    }
    @keyframes sunPulse {
      0%, 100% { opacity: 0.22; r: 138px; }
      50% { opacity: 0.36; r: 148px; }
    }
    @keyframes shootingStar {
      0%, 75% { opacity: 0; transform: translate(0, 0); }
      80% { opacity: 0.9; }
      92%, 100% { opacity: 0; transform: translate(-180px, 75px); }
    }
    @keyframes fireflyFloat {
      0%, 100% { transform: translate(0px, 0px); opacity: 0.35; }
      50% { transform: translate(8px, -12px); opacity: 0.9; }
    }

    .star-1 { animation: twinkle 3.6s ease-in-out infinite; }
    .star-2 { animation: twinkle 4.8s ease-in-out infinite 1.2s; }
    .star-3 { animation: twinkle 5.4s ease-in-out infinite 2.4s; }
    .cloud-a { animation: cloudDriftSlow 16s ease-in-out infinite; }
    .cloud-b { animation: cloudDriftReverse 19s ease-in-out infinite; }
    .sun-halo { animation: sunPulse 6s ease-in-out infinite; }
    .meteor { animation: shootingStar 9s ease-out infinite 1.5s; }
    .firefly { animation: fireflyFloat 5.5s ease-in-out infinite; }
  </style>

  <g clip-path="url(#bannerClip)">
    <!-- Sky Backdrop -->
    <rect x="0" y="0" width="1200" height="380" fill="url(#skyDusk)"/>

    <!-- Celestial Grid / Subtle Astrolabe Arcs in the Dusk Sky -->
    <g stroke="#ffbe98" stroke-opacity="0.09" fill="none" stroke-width="1">
      <circle cx="870" cy="210" r="190" stroke-dasharray="4 8"/>
      <circle cx="870" cy="210" r="245"/>
      <circle cx="870" cy="210" r="310" stroke-dasharray="2 10"/>
      <line x1="600" y1="210" x2="1140" y2="210" stroke-opacity="0.07"/>
      <line x1="870" y1="10" x2="870" y2="360" stroke-opacity="0.07"/>
    </g>

    <!-- Starfield & Constellations -->
    <g fill="#fff5eb">
      <circle cx="95" cy="48" r="1.4" class="star-1"/>
      <circle cx="185" cy="34" r="1.8" class="star-2"/>
      <circle cx="290" cy="66" r="1.2" class="star-3"/>
      <circle cx="420" cy="40" r="1.6" class="star-1"/>
      <circle cx="535" cy="72" r="1.3" class="star-2"/>
      <circle cx="655" cy="38" r="1.9" class="star-3"/>
      <circle cx="745" cy="64" r="1.3" class="star-1"/>
      <circle cx="990" cy="44" r="1.7" class="star-2"/>
      <circle cx="1085" cy="68" r="1.4" class="star-3"/>
      <circle cx="1145" cy="36" r="1.8" class="star-1"/>

      <!-- Constellation Lines (Cassini / Lyra style) -->
      <g stroke="#ffd6e0" stroke-opacity="0.22" stroke-width="0.9">
        <polyline points="655,38 710,55 745,64 775,35" fill="none"/>
        <polyline points="990,44 1040,30 1085,68 1145,36" fill="none"/>
      </g>
      <circle cx="710" cy="55" r="1.5" class="star-2"/>
      <circle cx="775" cy="35" r="1.4" class="star-3"/>
      <circle cx="1040" cy="30" r="1.6" class="star-1"/>
    </g>

    <!-- Shooting Star -->
    <g class="meteor">
      <line x1="1040" y1="45" x2="1105" y2="18" stroke="url(#borderGlow)" stroke-width="2" stroke-linecap="round"/>
      <circle cx="1040" cy="45" r="2.2" fill="#fff8f6"/>
    </g>

    <!-- Glowing Setting Sun on Right Horizon -->
    <circle cx="870" cy="210" r="142" fill="#ff7a93" opacity="0.26" class="sun-halo"/>
    <circle cx="870" cy="210" r="106" fill="url(#sunsetOrb)" mask="url(#sunScanlines)"/>

    <!-- Drifting Lo-fi Dusk Clouds -->
    <g class="cloud-a" opacity="0.65">
      <path d="M640 178 Q670 162 705 174 Q735 158 770 175 Q795 170 815 184 L620 184 Z" fill="#4f2152"/>
      <path d="M920 142 Q955 124 995 138 Q1030 126 1065 144 L905 144 Z" fill="#3a1946"/>
    </g>
    <g class="cloud-b" opacity="0.55">
      <path d="M735 232 Q775 215 820 228 Q860 212 905 229 Q935 222 965 235 L715 235 Z" fill="#2d133b"/>
      <path d="M120 198 Q165 182 210 194 Q245 184 280 200 L100 200 Z" fill="#471f4c"/>
    </g>

    <!-- Atmospheric Mist Layer -->
    <rect x="0" y="180" width="1200" height="200" fill="url(#horizonMist)"/>

    <!-- Layered Distant Mountain Ridges (Parallax Silhouette) -->
    <!-- Far Ridge -->
    <path d="M0 292 L95 258 L190 278 L310 242 L435 276 L560 248 L690 275 L795 246 L915 272 L1035 238 L1135 266 L1200 252 L1200 380 L0 380 Z" fill="#371945" opacity="0.88"/>

    <!-- Mid Ridge -->
    <path d="M0 318 L140 282 L265 308 L405 272 L530 306 L675 278 L830 310 L965 274 L1090 302 L1200 280 L1200 380 L0 380 Z" fill="#231032"/>

    <!-- Foreground Silhouette & Calm Lake Reflection -->
    <path d="M0 342 L180 318 L345 338 L520 314 L710 340 L885 322 L1045 342 L1200 324 L1200 380 L0 380 Z" fill="#130821"/>

    <!-- Shimmering Water Reflections Below Sun -->
    <g fill="#ffaa6c" opacity="0.45">
      <rect x="815" y="334" width="110" height="2.2" rx="1.1" class="star-1"/>
      <rect x="830" y="343" width="80" height="2" rx="1" class="star-2"/>
      <rect x="805" y="352" width="130" height="1.8" rx="0.9" class="star-3"/>
      <rect x="842" y="361" width="58" height="1.8" rx="0.9" class="star-1"/>
      <rect x="854" y="369" width="34" height="1.5" rx="0.7" class="star-2"/>
    </g>

    <!-- Distant Birds Silhouette (Vector Paths) -->
    <g stroke="#2a1138" stroke-width="1.8" fill="none" stroke-linecap="round">
      <path d="M785 152 Q791 145 797 151 Q803 145 809 152"/>
      <path d="M818 140 Q823 135 828 139 Q833 135 838 140"/>
      <path d="M765 166 Q769 161 774 165 Q779 161 783 166"/>
    </g>

    <!-- Warm Floating Fireflies / Dusk Embers -->
    <circle cx="620" cy="265" r="2.2" fill="#ffbe98" class="firefly"/>
    <circle cx="715" cy="295" r="1.8" fill="#ff9e64" class="firefly" style="animation-delay: 1.7s"/>
    <circle cx="980" cy="260" r="2.4" fill="#ffd6a5" class="firefly" style="animation-delay: 3.1s"/>
    <circle cx="1075" cy="290" r="1.7" fill="#ff7a93" class="firefly" style="animation-delay: 0.8s"/>

    <!-- Left Glassmorphic Typography Panel -->
    <g transform="translate(56, 48)">
      <rect x="0" y="0" width="650" height="278" rx="20" fill="url(#glassCard)" stroke="url(#borderGlow)" stroke-width="1.4"/>

      <!-- Subtle Inner Corner Vector Accents -->
      <path d="M18 12 H36 M12 18 V36" stroke="#ffbe98" stroke-opacity="0.5" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M632 266 H614 M638 260 V242" stroke="#bb9af7" stroke-opacity="0.5" stroke-width="1.5" stroke-linecap="round"/>

      <!-- Eyebrow with Vector Four-Point Star -->
      <g transform="translate(34, 34)">
        <path d="M8 0 L10.2 5.8 L16 8 L10.2 10.2 L8 16 L5.8 10.2 L0 8 L5.8 5.8 Z" fill="#ff9e64"/>
        <text x="26" y="12.5" class="eyebrow">SOFTWARE ENGINEER &#183; ARCHITECTURE &amp; AI</text>
      </g>

      <!-- Main Name & Handle -->
      <text x="34" y="106" class="hero-name">Dang Xuan Thai</text>
      <text x="392" y="104" class="hero-handle">@CallMeIAmTDF</text>

      <!-- Poetic Subtitle -->
      <text x="34" y="144" class="poetic-quote">"Crafting resilient systems and quiet algorithms beneath the dusk horizon."</text>

      <!-- Divider Line -->
      <line x1="34" y1="168" x2="614" y2="168" stroke="url(#borderGlow)" stroke-opacity="0.4" stroke-width="1"/>

      <!-- Vector Role / Domain Pills (No Emojis - Pure SVG Geometry + Text) -->
      <g transform="translate(34, 190)">
        <!-- Pill 1: Backend & Distributed Systems -->
        <g transform="translate(0, 0)">
          <rect x="0" y="0" width="184" height="32" rx="8" fill="#26143d" stroke="#ff9e64" stroke-opacity="0.45" stroke-width="1"/>
          <polygon points="16,10 22,16 16,22 10,16" fill="#ff9e64"/>
          <text x="30" y="20" class="role-pill-text">BACKEND &amp; CLOUD</text>
        </g>

        <!-- Pill 2: Full-Stack Web -->
        <g transform="translate(196, 0)">
          <rect x="0" y="0" width="188" height="32" rx="8" fill="#26143d" stroke="#f7768e" stroke-opacity="0.45" stroke-width="1"/>
          <circle cx="16" cy="16" r="5" stroke="#f7768e" stroke-width="1.8" fill="none"/>
          <text x="30" y="20" class="role-pill-text">MODERN FULL-STACK</text>
        </g>

        <!-- Pill 3: Applied AI & Data -->
        <g transform="translate(396, 0)">
          <rect x="0" y="0" width="184" height="32" rx="8" fill="#26143d" stroke="#bb9af7" stroke-opacity="0.45" stroke-width="1"/>
          <path d="M16 10 L21 19 H11 Z" fill="#bb9af7"/>
          <text x="30" y="20" class="role-pill-text">APPLIED AI &amp; RAG</text>
        </g>
      </g>

      <!-- Bottom Status Coordinate Line -->
      <g transform="translate(34, 248)">
        <circle cx="6" cy="0" r="3.5" fill="#73daca" class="star-1"/>
        <text x="18" y="4" class="eyebrow" style="fill: #d8bfd8; letter-spacing: 1.5px;">VIETNAM // UTC+7 &#183; OPEN TO COLLABORATION</text>
      </g>
    </g>

    <!-- Outer Frame Border -->
    <rect x="1" y="1" width="1198" height="378" rx="21" fill="none" stroke="url(#borderGlow)" stroke-width="1.5"/>
  </g>
</svg>

