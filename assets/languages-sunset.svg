          <circle cx="6" cy="-4" r="3.5" fill="#ff9e64"/>
          <text x="20" y="0" class="rank-lbl">RANK #01</text>
          <text x="168" y="2" text-anchor="end" class="lang-pct" fill="#ff9e64">28.0%</text>
