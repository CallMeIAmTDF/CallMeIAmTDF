        <!-- Top Rank & Percentage -->
        <g transform="translate(18, 22)">
          <rect x="0" y="-10" width="12" height="12" rx="3" transform="rotate(45 6 -4)" fill="#7aa2f7" opacity="0.3"/>
          <circle cx="6" cy="-4" r="3.5" fill="#7aa2f7"/>
          <text x="20" y="0" class="rank-lbl">RANK #03</text>
          <text x="168" y="2" text-anchor="end" class="lang-pct" fill="#7aa2f7">21.8%</text>
        </g>

        <!-- Language Name -->
        <text x="18" y="62" class="lang-name">TypeScript</text>

        <!-- Project & PR Count (Separate Line -> Never Overlaps) -->
        <text x="18" y="84" class="lang-meta">14 repos &#183; 1 PR repo</text>

        <!-- Progress Track -->
        <rect x="18" y="100" width="168" height="6" rx="3" fill="#100920"/>
        <rect x="18" y="100" width="37" height="6" rx="3" fill="#7aa2f7"/>
      </g>

      <g transform="translate(719, 236)">
        <rect x="0" y="0" width="204" height="126" rx="14" fill="#1d1233" fill-opacity="0.78" stroke="#e0af68" stroke-opacity="0.35" stroke-width="1.2"/>
        
        <!-- Top Rank & Percentage -->
        <g transform="translate(18, 22)">
          <rect x="0" y="-10" width="12" height="12" rx="3" transform="rotate(45 6 -4)" fill="#e0af68" opacity="0.3"/>
          <circle cx="6" cy="-4" r="3.5" fill="#e0af68"/>
          <text x="20" y="0" class="rank-lbl">RANK #04</text>
          <text x="168" y="2" text-anchor="end" class="lang-pct" fill="#e0af68">17.2%</text>
        </g>

        <!-- Language Name -->
        <text x="18" y="62" class="lang-name">Python</text>

        <!-- Project & PR Count (Separate Line -> Never Overlaps) -->
        <text x="18" y="84" class="lang-meta">23 repositories</text>

        <!-- Progress Track -->
        <rect x="18" y="100" width="168" height="6" rx="3" fill="#100920"/>
        <rect x="18" y="100" width="29" height="6" rx="3" fill="#e0af68"/>
      </g>

      <g transform="translate(940, 236)">
        <rect x="0" y="0" width="204" height="126" rx="14" fill="#1d1233" fill-opacity="0.78" stroke="#bb9af7" stroke-opacity="0.35" stroke-width="1.2"/>
        
        <!-- Top Rank & Percentage -->
        <g transform="translate(18, 22)">
          <rect x="0" y="-10" width="12" height="12" rx="3" transform="rotate(45 6 -4)" fill="#bb9af7" opacity="0.3"/>
          <circle cx="6" cy="-4" r="3.5" fill="#bb9af7"/>
          <text x="20" y="0" class="rank-lbl">RANK #05</text>
          <text x="168" y="2" text-anchor="end" class="lang-pct" fill="#bb9af7">5.5%</text>
        </g>

        <!-- Language Name -->
        <text x="18" y="62" class="lang-name">PHP</text>

        <!-- Project & PR Count (Separate Line -> Never Overlaps) -->
        <text x="18" y="84" class="lang-meta">4 repos &#183; 1 PR repo</text>

        <!-- Progress Track -->
        <rect x="18" y="100" width="168" height="6" rx="3" fill="#100920"/>
        <rect x="18" y="100" width="12" height="6" rx="3" fill="#bb9af7"/>
      </g>

    <!-- Footer Line -->
    <line x1="56" y1="382" x2="1144" y2="382" stroke="#ff9e64" stroke-opacity="0.16" stroke-width="1"/>
    <text x="56" y="402" class="footer-note">DATA SOURCE: GITHUB GRAPHQL API (PUBLIC + PRIVATE REPOSITORIES + EXTERNAL PULL REQUESTS)</text>
    <text x="1144" y="402" text-anchor="end" class="footer-note">LO-FI SUNSET TELEMETRY &#183; @CallMeIAmTDF</text>
